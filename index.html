<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050811">
<title>CryptX Enterprise</title>
<style>
:root{--bg-void:#050811;--bg-surface:#0d1322;--bg-elevated:#161f35;--primary:#38bdf8;--primary-glow:rgba(56,189,248,0.25);--accent:#f43f5e;--success:#10b981;--warning:#f59e0b;--text-main:#f8fafc;--text-dim:#94a3b8;--border:rgba(255,255,255,0.08)}
*{box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,.selectable{-webkit-user-select:text;user-select:text}
body{background:#000;color:var(--text-main);display:flex;justify-content:center;min-height:100vh;overflow-x:hidden}
.app-frame{width:100%;max-width:480px;background:var(--bg-void);min-height:100vh;display:flex;flex-direction:column;position:relative}
.view-screen{display:none;flex-direction:column;flex:1;padding:28px 22px}
.view-screen.active{display:flex}
.center-box{margin:auto 0;width:100%;text-align:center}
.logo-shield{width:80px;height:80px;margin:0 auto 16px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 10px 25px var(--primary-glow)}
.brand-title{font-size:42px;font-weight:900;letter-spacing:1.5px;color:var(--text-main)}
.brand-title span{color:var(--primary)}
.brand-desc{color:var(--text-dim);font-size:14px;margin:6px 0 28px}
.input-group{margin-bottom:12px;text-align:right}
.input-label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600}
input,textarea{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-main);font-size:15px;outline:none}
input:focus,textarea:focus{border-color:var(--primary)}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(0.96)}
.btn-primary{background:linear-gradient(135deg,#38bdf8,#0284c7);color:#050811}
.btn-dark{background:var(--bg-elevated);color:var(--text-main);border:1px solid var(--border)}
.btn-danger{background:rgba(244,63,94,0.15);color:var(--accent);border:1px solid rgba(244,63,94,0.3)}
.alert-box{margin-top:14px;padding:10px 14px;border-radius:12px;font-size:13px;display:none;line-height:1.5}
.alert-error{background:rgba(244,63,94,0.15);color:#fda4af;border:1px solid rgba(244,63,94,0.3);display:block}
.alert-info{background:rgba(56,189,248,0.15);color:#7dd3fc;border:1px solid rgba(56,189,248,0.3);display:block}
.app-header{background:rgba(13,19,34,0.95);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.hdr-logo{font-size:22px;font-weight:900}
.hdr-logo span{color:var(--primary)}
.hdr-pill{background:var(--bg-elevated);border:1px solid var(--border);padding:5px 12px;border-radius:20px;font-size:12px;color:var(--primary);font-weight:700}
.main-scroll{flex:1;overflow-y:auto;padding:16px;padding-bottom:95px}
.sub-tab{display:none;flex-direction:column}
.sub-tab.active{display:flex}
.search-bar{display:flex;gap:8px;margin-bottom:16px}
.search-bar input{margin:0}
.search-bar button{width:auto;margin:0;padding:0 20px}
.friend-card{background:var(--bg-surface);border:1px solid var(--border);padding:14px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.friend-meta{display:flex;align-items:center;gap:12px}
.avatar-circle{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#fff}
.room-top{background:var(--bg-surface);border:1px solid var(--border);padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.room-controls{display:flex;justify-content:space-between;align-items:center;background:var(--bg-elevated);padding:8px 12px;border-radius:12px;margin-bottom:8px;font-size:12px}
.btn-mini{width:auto;margin:0;padding:7px 12px;font-size:12px;border-radius:10px}
.chat-stream{background:#03050a;border:1px solid var(--border);border-radius:16px;padding:14px;height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin:8px 0}
.msg-bubble{background:var(--bg-elevated);padding:12px 14px;border-radius:16px;border-bottom-right-radius:4px;max-width:86%;align-self:flex-start;font-size:13px;word-break:break-all;border:1px solid var(--border)}
.msg-bubble.sent{background:#0c4a6e;border-color:rgba(56,189,248,0.3);align-self:flex-end;border-bottom-right-radius:16px;border-bottom-left-radius:4px}
.msg-info{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);margin-bottom:5px;gap:15px}
.btn-decrypt-msg{background:var(--bg-void);color:var(--primary);border:1px solid var(--primary);padding:5px 12px;border-radius:8px;font-size:11px;font-weight:bold;margin-top:8px;cursor:pointer}
.profile-hero{display:flex;flex-direction:column;align-items:center;padding:16px 0 22px;border-bottom:1px solid var(--border)}
.hero-avatar{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#fff;margin-bottom:14px;box-shadow:0 0 0 4px var(--bg-void),0 0 0 6px var(--primary)}
.hero-name{font-size:21px;font-weight:900}
.hero-username{background:var(--bg-elevated);color:var(--text-dim);padding:6px 16px;border-radius:20px;font-size:13px;margin-top:6px;cursor:pointer;border:1px solid var(--border)}
.hero-bio{color:var(--text-dim);font-size:13px;margin-top:10px;text-align:center;max-width:85%}
.stats-grid{display:flex;width:100%;margin-top:22px;background:var(--bg-surface);border-radius:16px;padding:14px 0;border:1px solid var(--border)}
.stat-cell{flex:1;text-align:center}
.stat-cell:not(:last-child){border-left:1px solid var(--border)}
.stat-number{font-size:17px;font-weight:900;color:var(--text-main)}
.stat-title{font-size:11px;color:var(--text-dim);margin-top:3px}
.menu-list{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.menu-card{background:var(--bg-surface);border:1px solid var(--border);padding:14px 16px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.bottom-nav{position:fixed;bottom:0;width:100%;max-width:480px;background:rgba(13,19,34,0.98);border-top:1px solid var(--border);display:flex;padding:10px 0;z-index:60}
.nav-tab{flex:1;text-align:center;color:var(--text-dim);font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav-tab.active{color:var(--primary);font-weight:800}
.nav-tab span.icon{font-size:20px}
</style>
</head>
<body oncontextmenu="return false;">
<div class="app-frame">
<div id="scr-auth" class="view-screen active">
<div class="center-box">
<div class="logo-shield">🛡️</div>
<div class="brand-title">Crypt<span>X</span></div>
<p class="brand-desc">منصة التراسل المشفر والخصوصية المطلقة</p>
<div class="input-group">
<label class="input-label">البريد الإلكتروني (Gmail)</label>
<input type="email" id="authEmail" placeholder="example@gmail.com">
</div>
<div class="input-group">
<label class="input-label">كلمة المرور</label>
<input type="password" id="authPass" placeholder="••••••••">
</div>
<button type="button" class="btn btn-primary" id="btnAuthAction">دخول / إنشاء حساب جديد 🚀</button>
<button type="button" class="btn btn-dark" id="btnInstantGuest">دخول فوري وسريع كضيف 🕵️‍♂️</button>
<div id="authFeedback" class="alert-box"></div>
</div>
</div>

<div id="scr-onboarding" class="view-screen">
<div class="center-box">
<h2 style="font-size:24px;margin-bottom:8px;">أنشئ هويتك الرقمية</h2>
<p style="color:var(--text-dim);font-size:13px;margin-bottom:24px;">اختر اسماً واسم مستخدم فريد لا يتكرر ليجدك أصدقاؤك</p>
<div class="input-group">
<label class="input-label">الاسم الظاهر</label>
<input type="text" id="regName" placeholder="مثال: سعد ماهر">
</div>
<div class="input-group">
<label class="input-label">اسم المستخدم الفريد (بالإنجليزية فقط)</label>
<input type="text" id="regUsername" placeholder="مثال: saad99">
</div>
<div class="input-group">
<label class="input-label">النبذة الشخصية (Bio)</label>
<input type="text" id="regBio" placeholder="اكتب عبارة قصيرة عنك...">
</div>
<button type="button" class="btn btn-primary" id="btnCreateProfile">تأكيد وحفظ الحساب ✅</button>
<div id="setupFeedback" class="alert-box"></div>
</div>
</div>

<div id="scr-lock" class="view-screen">
<div class="center-box">
<div class="logo-shield" style="width:65px;height:65px;font-size:30px;">🔒</div>
<h2 style="margin-bottom:8px;">التطبيق مقفل</h2>
<p style="color:var(--text-dim);font-size:13px;margin-bottom:20px;">أدخل رمز قفل الشاشة الخاص بك للمتابعة</p>
<input type="password" id="unlockPinInput" placeholder="••••" style="text-align:center;font-size:22px;letter-spacing:8px;">
<button type="button" class="btn btn-primary" id="btnUnlockApp">فتح القفل 🔓</button>
<div id="lockFeedback" class="alert-box"></div>
</div>
</div>

<div id="scr-home" class="view-screen" style="padding:0;">
<div class="app-header">
<div class="hdr-logo">Crypt<span>X</span></div>
<div class="hdr-pill" id="topUsernameBadge">@user</div>
</div>

<div class="main-scroll">
<div id="tab-messages" class="sub-tab active">
<div id="directorySection">
<div class="search-bar">
<input type="text" id="friendSearchInput" placeholder="ابحث باسم مستخدم صديقك...">
<button type="button" class="btn btn-primary" id="btnFindFriend">بحث 🔍</button>
