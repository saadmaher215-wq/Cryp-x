<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CryptX</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0;user-select:none}
input,textarea{user-select:text;width:100%;padding:14px;border-radius:12px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:15px;margin-bottom:10px;outline:none}
body{background:#050811;color:#f8fafc;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:480px;padding:24px 18px;display:flex;flex-direction:column}
.scr{display:none;flex-direction:column;flex:1}.scr.active{display:flex}
.box{margin:auto 0;text-align:center}
h1{font-size:38px;font-weight:900;margin-bottom:6px}h1 span{color:#38bdf8}
p.sub{color:#94a3b8;font-size:13px;margin-bottom:24px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px}
.b1{background:#38bdf8;color:#050811}.b2{background:#1e293b;color:#fff}.b3{background:#f43f5e;color:#fff}
.msg{margin-top:12px;padding:10px;border-radius:10px;font-size:13px;background:#1e293b;color:#38bdf8;display:none}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #1e293b;margin-bottom:14px}
.chat{background:#02040a;border:1px solid #1e293b;border-radius:12px;padding:12px;height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin:8px 0}
.bbl{background:#1e293b;padding:10px;border-radius:12px;font-size:13px;word-break:break-all;align-self:flex-start;max-width:85%}
.bbl.me{background:#0c4a6e;align-self:flex-end}
.nav{display:flex;gap:6px;margin-top:auto;padding-top:12px}
</style>
</head>
<body>
<div class="app">

<div id="s-login" class="scr active">
<div class="box">
<h1>Crypt<span>X</span></h1>
<p class="sub">منصة التراسل المشفر والخصوصية المطلقة</p>
<input id="lUser" placeholder="اسم المستخدم (مثال: user_101)">
<input type="password" id="lPass" placeholder="كلمة المرور">
<button type="button" class="btn b1" id="btnLogin">تسجيل الدخول 🚀</button>
<button type="button" class="btn b2" id="btnToSignup">إنشاء حساب جديد ✨</button>
<div id="fb1" class="msg"></div>
</div>
</div>

<div id="s-signup" class="scr">
<div class="box">
<h2 style="margin-bottom:6px">إنشاء حساب جديد</h2>
<p class="sub">اختر بياناتك للانضمام إلى الشبكة المشفرة</p>
<input id="sName" placeholder="الاسم الظاهر (مثال: مستخدم جديد)">
<input id="sUser" placeholder="اسم المستخدم بالإنجليزية (مثال: user_101)">
<input type="password" id="sPass" placeholder="كلمة المرور (4 أحرف أو أرقام+)">
<button type="button" class="btn b1" id="btnSignup">تأكيد وإنشاء الحساب ✅</button>
<button type="button" class="btn b2" id="btnToLogin">لدي حساب بالفعل (دخول) ➔</button>
<div id="fb2" class="msg"></div>
</div>
</div>

<div id="s-home" class="scr">
<div class="hdr"><b style="font-size:20px">Crypt<span style="color:#38bdf8">X</span></b><span id="myTag" style="color:#38bdf8;font-size:13px">@user</span></div>
<div id="t-chat" style="display:flex;flex-direction:column;flex:1">
<div style="display:flex;gap:6px"><input id="qInput" placeholder="ابحث باسم مستخدم صديقك..."><button type="button" class="btn b1" style="width:auto;margin:0;padding:0 18px" id="btnSearch">بحث</button></div>
<div id="qRes"></div>
<div id="roomBox" style="display:none;flex-direction:column;flex:1">
<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><b id="peerTitle" style="color:#38bdf8"></b><button type="button" class="btn b2" style="width:auto;padding:6px 12px;margin:0" id="btnClose">إغلاق</button></div>
<input type="password" id="roomKey" placeholder="🔑 الرمز السري المشترك بينكما...">
<div id="stream" class="chat"></div>
<textarea id="draft" rows="2" placeholder="اكتب رسالتك المشفرة..."></textarea>
<button type="button" class="btn b1" id="btnSend">إرسال مشفر 🔒</button>
</div>
</div>
<div id="t-tool" style="display:none;flex-direction:column">
<textarea id="tIn" rows="3" placeholder="النص أو الرموز المشفرة..."></textarea>
<input type="password" id="tKey" placeholder="كلمة السر...">
<div style="display:flex;gap:8px"><button type="button" class="btn b1" id="btnEnc">تشفير 🔒</button><button type="button" class="btn b2" id="btnDec">فك التشفير 🔓</button></div>
<textarea id="tOut" rows="3" readonly placeholder="النتيجة ستظهر هنا..."></textarea>
</div>
<div class="nav">
<button type="button" class="btn b2" id="nav1">💬 المحادثات</button>
<button type="button" class="btn b2" id="nav2">🔐 التشفير</button>
<button type="button" class="btn b3" style="width:auto;padding:0 16px" id="btnOut">خروج</button>
</div>
</div>

</div>

<script type="module">
import { initializeApp } from "https://gstatic.com";
import { getFirestore, doc, getDoc, setDoc, collection, addDoc, onSnapshot, query, orderBy } from "https://gstatic.com";

const app = initializeApp({ projectId: "cryptx-app" });
const db = getFirestore(app);
let prof = JSON.parse(localStorage.getItem("cx_prof") || "null");
let peer = null, unsub = null;

const go = id => { document.querySelectorAll(".scr").forEach(e => e.classList.remove("active")); document.getElementById(id).classList.add("active"); };
const note = (id, t) => { const e = document.getElementById(id); e.style.display = "block"; e.innerText = t; };
const openHome = () => { document.getElementById("myTag").innerText = "@" + prof.user; go("s-home"); };

if (prof) openHome();

document.getElementById("btnToSignup").onclick = () => go("s-signup");
document.getElementById("btnToLogin").onclick = () => go("s-login");
document.getElementById("nav1").onclick = () => { document.getElementById("t-chat").style.display = "flex"; document.getElementById("t-tool").style.display = "none"; };
document.getElementById("nav2").onclick = () => { document.getElementById("t-chat").style.display = "none"; document.getElementById("t-tool").style.display = "flex"; };
document.getElementById("btnOut").onclick = () => { localStorage.clear(); location.reload(); };

document.getElementById("btnSignup").onclick = async () => {
  const name = document.getElementById("sName").value.trim();
  const user = document.getElementById("sUser").value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
  const pass = document.getElementById("sPass").value;
  if (!name || user.length < 3 || pass.length < 4) { note("fb2", "⚠️ املأ جميع الخانات (اسم المستخدم 3 أحرف+ وكلمة المرور 4+)"); return; }
  note("fb2", "⏳ جاري إنشاء الحساب...");
  try {
    const ref = doc(db, "accounts", user);
    const snap = await getDoc(ref);
    if (snap.exists()) { note("fb2", "❌ اسم المستخدم محجوز! اختر غيره."); return; }
    await setDoc(ref, { name, user, pass });
    prof = { name, user }; localStorage.setItem("cx_prof", JSON.stringify(prof)); openHome();
  } catch (e) { note("fb2", "❌ خطأ: " + e.message); }
};

document.getElementById("btnLogin").onclick = async () => {
  const user = document.getElementById("lUser").value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
  const pass = document.getElementById("lPass").value;
  if (user.length < 3 || !pass) { note("fb1", "⚠️ أدخل اسم المستخدم وكلمة المرور"); return; }
  note("fb1", "⏳ جاري تسجيل الدخول...");
  try {
    const snap = await getDoc(doc(db, "accounts", user));
    if (!snap.exists()) { note("fb1", "❌ الحساب غير موجود! اضغط على (إنشاء حساب جديد ✨)"); return; }
    const d = snap.data();
    if (d.pass !== pass) { note("fb1", "❌ كلمة المرور غير صحيحة!"); return; }
    prof = { name: d.name, user }; localStorage.setItem("cx_prof", JSON.stringify(prof)); openHome();
  } catch (e) { note("fb1", "❌ خطأ: " + e.message); }
};

document.getElementById("btnSearch").onclick = async () => {
  const u = document.getElementById("qInput").value.trim().toLowerCase().replace("@", ""), out = document.getElementById("qRes");
  if (!u || u === prof.user) return;
  out.innerHTML = "<div class='msg' style='display:block'>⏳ جاري البحث...</div>";
  try {
    const snap = await getDoc(doc(db, "accounts", u));
    if (!snap.exists()) { out.innerHTML = "<div class='msg' style='display:block;color:#f43f5e'>❌ غير موجود</div>"; return; }
    const d = snap.data(); peer = { user: u, name: d.name }; out.innerHTML = "";
    document.getElementById("roomBox").style.display = "flex"; document.getElementById("peerTitle").innerText = peer.name + " (@" + peer.user + ")";
    const rid = [prof.user, peer.user].sort().join("_");
    if (unsub) unsub();
    unsub = onSnapshot(query(collection(db, "chats", rid, "messages"), orderBy("ts")), qs => {
      const st = document.getElementById("stream"); st.innerHTML = "";
      qs.forEach(m => {
        const msg = m.data(), div = document.createElement("div");
        div.className = "bbl" + (msg.s === prof.user ? " me" : "");
        div.innerHTML = "<div style='font-size:10px;color:#94a3b8'>@" + msg.s + "</div><div>" + msg.c + "</div>";
        const btn = document.createElement("button"); btn.innerText = "فك التشفير 🔓";
        btn.style.cssText = "margin-top:6px;padding:4px 10px;border-radius:6px;border:1px solid #38bdf8;background:#050811;color:#38bdf8;font-size:11px";
        btn.onclick = async () => {
          const k = document.getElementById("roomKey").value; if (!k) { alert("أدخل الرمز السري أولاً!"); return; }
          try { btn.previousElementSibling.innerText = await dec(msg.c, k); btn.remove(); } catch { alert("❌ الرمز السري خطأ!"); }
        };
        div.appendChild(btn); st.appendChild(div);
      });
      st.scrollTop = st.scrollHeight;
    });
  } catch (e) { out.innerHTML = "<div class='msg' style='display:block;color:#f43f5e'>❌ " + e.message + "</div>"; }
};

document.getElementById("btnClose").onclick = () => { if (unsub) unsub(); document.getElementById("roomBox").style.display = "none"; };

async function enc(t, p) {
  const s = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: s, iterations: 100000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const c = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode(t)));
  const b = new Uint8Array(28 + c.length); b.set(s); b.set(iv, 16); b.set(c, 28);
  return btoa(String.fromCharCode(...b));
}

async function dec(b64, p) {
  const b = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b.slice(0, 16), iterations: 100000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(16, 28) }, k, b.slice(28)));
}

document.getElementById("btnSend").onclick = async () => {
  const t = document.getElementById("draft").value.trim(), k = document.getElementById("roomKey").value;
  if (!t || !k) { alert("اكتب الرسالة والرمز السري!"); return; }
  const rid = [prof.user, peer.user].sort().join("_"), c = await enc(t, k);
  document.getElementById("draft").value = "";
  await addDoc(collection(db, "chats", rid, "messages"), { s: prof.user, c, ts: Date.now() });
};

document.getElementById("btnEnc").onclick = async () => { const t = document.getElementById("tIn").value.trim(), k = document.getElementById("tKey").value; if (t && k) document.getElementById("tOut").value = await enc(t, k); };
document.getElementById("btnDec").onclick = async () => { const t = document.getElementById("tIn").value.trim(), k = document.getElementById("tKey").value; if (!t || !k) return; try { document.getElementById("tOut").value = await dec(t, k); } catch { alert("❌ خطأ في البيانات أو كلمة السر"); } };
</script>
</body>
</html>
