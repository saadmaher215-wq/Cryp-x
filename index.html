<script>
const RTDB = "https://firebaseio.com";
let prof = null;
try { prof = JSON.parse(localStorage.getItem("cx_prof") || "null"); } catch(e) {}
let peer = null, tmr = null, newAv = null, targetMsg = null;
let cImg = null, cx = 0, cy = 0, drag = false, lx = 0, ly = 0;

function go(id) {
  document.querySelectorAll(".scr").forEach(e => e.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function pop(t, err) {
  const e = document.getElementById("toast");
  e.innerText = t;
  e.style.borderColor = err ? "#f43f5e" : "#38bdf8";
  e.style.display = "block";
  clearTimeout(window._tt);
  window._tt = setTimeout(() => { e.style.display = "none"; }, 3200);
}

function renderAv(src) {
  const has = src && src.startsWith("data:image");
  document.getElementById("hdrImg").style.display = has ? "block" : "none";
  document.getElementById("pImg").style.display = has ? "block" : "none";
  document.getElementById("hdrSvg").style.display = has ? "none" : "block";
  document.getElementById("pSvg").style.display = has ? "none" : "block";
  if (has) {
    document.getElementById("hdrImg").src = src;
    document.getElementById("pImg").src = src;
  }
}

function openHome() {
  const tag = "@" + prof.user;
  document.getElementById("myTag").innerText = tag;
  document.getElementById("pHandle").innerText = tag + " 📋";
  document.getElementById("pTitle").innerText = prof.name;
  document.getElementById("pName").value = prof.name;
  renderAv(prof.av);
  go("s-home");
}
if (prof) openHome();

async function doSignup() {
  const name = document.getElementById("sName").value.trim();
  const user = document.getElementById("sUser").value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
  const pass = document.getElementById("sPass").value;
  if (!name || user.length < 3 || pass.length < 4) return pop("⚠️ املأ جميع الخانات (المستخدم 3+ وكلمة المرور 4+)", 1);
  pop("⏳ جاري إنشاء الحساب...");
  try {
    const chk = await (await fetch(RTDB + "/users/" + user + ".json")).json();
    if (chk) return pop("❌ اسم المستخدم محجوز!", 1);
    await fetch(RTDB + "/users/" + user + ".json", { method: "PUT", body: JSON.stringify({ name, pass, av: "" }) });
    prof = { name, user, av: "" };
    localStorage.setItem("cx_prof", JSON.stringify(prof));
    openHome();
    pop("✅ تم إنشاء الحساب بنجاح!");
  } catch (e) { pop("❌ خطأ في الاتصال", 1); }
}

async function doLogin() {
  const user = document.getElementById("lUser").value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
  const pass = document.getElementById("lPass").value;
  if (user.length < 3 || !pass) return pop("⚠️ أدخل اسم المستخدم وكلمة المرور", 1);
  pop("⏳ جاري الدخول...");
  try {
    const u = await (await fetch(RTDB + "/users/" + user + ".json")).json();
    if (!u) return pop("❌ الحساب غير موجود!", 1);
    if (u.pass !== pass) return pop("❌ كلمة المرور غير صحيحة!", 1);
    prof = { name: u.name, user, av: u.av || "" };
    localStorage.setItem("cx_prof", JSON.stringify(prof));
    openHome();
    pop("👋 أهلاً بك يا " + u.name);
  } catch (e) { pop("❌ خطأ في الاتصال", 1); }
}

function tab(n) {
  document.getElementById("t-chat").style.display = n === 1 ? "flex" : "none";
  document.getElementById("t-tool").style.display = n === 2 ? "flex" : "none";
  document.getElementById("t-prof").style.display = n === 3 ? "flex" : "none";
}
function logout() { localStorage.clear(); location.reload(); }
function copyHandle() { navigator.clipboard.writeText("@" + prof.user); pop("📋 تم نسخ اسم المستخدم!"); }

function pickImg(inp) {
  const file = inp.files && inp.files;
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    cImg = new Image();
    cImg.onload = () => {
      cx = 0; cy = 0;
      document.getElementById("zoomRng").value = 1;
      document.getElementById("cropModal").style.display = "flex";
      drawCrop();
    };
    cImg.src = e.target.result;
  };
  r.readAsDataURL(file);
  inp.value = "";
}

function drawCrop() {
  if (!cImg) return;
  const cvs = document.getElementById("cropCvs");
  const ctx = cvs.getContext("2d");
  const z = parseFloat(document.getElementById("zoomRng").value);
  ctx.clearRect(0, 0, 240, 240);
  const sc = Math.max(240 / cImg.width, 240 / cImg.height) * z;
  const w = cImg.width * sc, h = cImg.height * sc;
  ctx.drawImage(cImg, (240 - w) / 2 + cx, (240 - h) / 2 + cy, w, h);
}

const cb = document.getElementById("cropBox");
if (cb) {
  cb.onpointerdown = e => { drag = true; lx = e.clientX; ly = e.clientY; cb.setPointerCapture(e.pointerId); };
  cb.onpointermove = e => { if (!drag) return; cx += e.clientX - lx; cy += e.clientY - ly; lx = e.clientX; ly = e.clientY; drawCrop(); };
  cb.onpointerup = () => { drag = false; };
}

function applyCrop() {
  newAv = document.getElementById("cropCvs").toDataURL("image/jpeg", 0.85);
  renderAv(newAv);
  document.getElementById("cropModal").style.display = "none";
  pop("✂️ تم قص الصورة بنجاح! اضغط حفظ التعديلات");
}
function resetAv() { newAv = ""; renderAv(""); pop("🕵️ تم تفعيل صورة الشخص المجهول! اضغط حفظ"); }

async function saveProf() {
  const name = document.getElementById("pName").value.trim();
  const pass = document.getElementById("pPass").value;
  if (!name) return pop("⚠️ الاسم الظاهر مطلوب", 1);
  pop("⏳ جاري حفظ الإعدادات...");
  try {
    const cur = await (await fetch(RTDB + "/users/" + prof.user + ".json")).json();
    const finalAv = newAv !== null ? newAv : (prof.av || "");
    const up = { name, pass: pass.length >= 4 ? pass : cur.pass, av: finalAv };
    await fetch(RTDB + "/users/" + prof.user + ".json", { method: "PUT", body: JSON.stringify(up) });
    prof.name = name; prof.av = finalAv; newAv = null;
    document.getElementById("pPass").value = "";
    localStorage.setItem("cx_prof", JSON.stringify(prof));
    openHome();
    pop("✅ تم تحديث صورتك وبياناتك بنجاح!");
  } catch (e) { pop("❌ تعذر حفظ التعديلات", 1); }
}

async function findPeer() {
  const u = document.getElementById("qInput").value.trim().toLowerCase().replace("@", "");
  if (!u || u === prof.user) return;
  pop("⏳ جاري البحث...");
  const d = await (await fetch(RTDB + "/users/" + u + ".json")).json();
  if (!d) return pop("❌ المستخدم غير موجود", 1);
  peer = { user: u, name: d.name };
  document.getElementById("roomBox").style.display = "flex";
  document.getElementById("peerTitle").innerText = peer.name + " (@" + peer.user + ")";
  loadMsgs();
  if (tmr) clearInterval(tmr);
  tmr = setInterval(loadMsgs, 3500);
}
function closeRoom() { clearInterval(tmr); document.getElementById("roomBox").style.display = "none"; }

async function enc(t, p) {
  const s = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: s, iterations: 100000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["encrypt"]);
  const c = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, k, new TextEncoder().encode(t)));
  const b = new Uint8Array(28 + c.length); b.set(s); b.set(iv, 16); b.set(c, 28);
  return btoa(String.fromCharCode(...b));
}

async function dec(b64, p) {
  const b = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b.slice(0, 16), iterations: 100000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b.slice(16, 28) }, k, b.slice(28)));
}

async function sendMsg() {
  const t = document.getElementById("draft").value.trim();
  if (!t) return pop("⚠️ اكتب رسالتك أولاً!", 1);
  const pin = String(Math.floor(1000 + Math.random() * 9000));
  const rid = [prof.user, peer.user].sort().join("_"), c = await enc(t, pin);
  document.getElementById("draft").value = "";
  document.getElementById("lastPinVal").innerText = pin;
  document.getElementById("lastPinBox").style.display = "flex";
  pop("🔒 تم الإرسال! الرمز السري للرسالة: " + pin);
  await fetch(RTDB + "/chats/" + rid + ".json", { method: "POST", body: JSON.stringify({ s: prof.user, c }) });
  loadMsgs();
}
function copyPin() { navigator.clipboard.writeText(document.getElementById("lastPinVal").innerText); pop("📋 تم نسخ الرمز السري!"); }

async function loadMsgs() {
  if (!peer) return;
  const rid = [prof.user, peer.user].sort().join("_"), st = document.getElementById("stream");
  const data = await (await fetch(RTDB + "/chats/" + rid + ".json")).json();
  st.innerHTML = "";
  if (!data) return;
  Object.values(data).forEach(m => {
    const div = document.createElement("div");
    div.className = "bbl" + (m.s === prof.user ? " me" : "");
    div.innerHTML = "<div style='font-size:10px;color:#94a3b8'>@" + m.s + "</div><div>" + m.c + "</div>";
    const btn = document.createElement("button");
    btn.innerText = "فك التشفير 🔓";
    btn.style.cssText = "margin-top:6px;padding:5px 12px;border-radius:8px;border:1px solid #38bdf8;background:#050811;color:#38bdf8;font-size:11px;font-weight:700";
    btn.onclick = () => { targetMsg = { el: btn.previousElementSibling, btn, cipher: m.c }; document.getElementById("pinInp").value = ""; document.getElementById("pinModal").style.display = "flex"; document.getElementById("pinInp").focus(); };
    div.appendChild(btn);
    st.appendChild(div);
  });
}
function closePin() { document.getElementById("pinModal").style.display = "none"; }
async function confirmPin() {
  const k = document.getElementById("pinInp").value.trim();
  if (k.length < 4) return pop("⚠️ أدخل 4 أرقام", 1);
  try { targetMsg.el.innerText = await dec(targetMsg.cipher, k); targetMsg.btn.remove(); closePin(); pop("🔓 تم فك التشفير بنجاح!"); }
  catch (e) { pop("❌ الرمز السري من 4 أرقام غير صحيح!", 1); }
}

async function runTool(isEnc) {
  const t = document.getElementById("tIn").value.trim(), k = document.getElementById("tKey").value;
  if (!t || !k) return pop("⚠️ أدخل النص وكلمة السر", 1);
  try { document.getElementById("tOut").value = isEnc ? await enc(t, k) : await dec(t, k); pop(isEnc ? "🔒 تم التشفير بنجاح" : "🔓 تم فك التشفير"); }
  catch (e) { pop("❌ خطأ في البيانات أو كلمة السر", 1); }
}
function copyOut() {
  const v = document.getElementById("tOut").value;
  if (!v) return;
  navigator.clipboard.writeText(v);
  pop("📋 تم نسخ النتيجة إلى الحافظة!");
}
</script>
</body>
</html>
