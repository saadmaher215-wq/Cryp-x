<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CryptX</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{background:#050811;color:#f8fafc;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:480px;padding:24px 18px;display:flex;flex-direction:column}
.scr{display:none;flex-direction:column;flex:1}.scr.active{display:flex}
.box{margin:auto 0;text-align:center}
h1{font-size:38px;font-weight:900;margin-bottom:6px}h1 span{color:#38bdf8}
p.sub{color:#94a3b8;font-size:13px;margin-bottom:24px}
input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:15px;margin-bottom:10px;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px}
.b1{background:#38bdf8;color:#050811}.b2{background:#1e293b;color:#fff}.b3{background:#f43f5e;color:#fff}
.msg{margin-top:12px;padding:10px;border-radius:10px;font-size:13px;background:#1e293b;color:#38bdf8;display:none}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #1e293b;margin-bottom:14px}
.chat{background:#02040a;border:1px solid #1e293b;border-radius:12px;padding:12px;height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin:8px 0}
.bbl{background:#1e293b;padding:10px;border-radius:12px;font-size:13px;word-break:break-all;align-self:flex-start;max-width:85%}
.bbl.me{background:#0c4a6e;align-self:flex-end}
.nav{display:flex;gap:6px;margin-top:auto;padding-top:12px}
</style>
</head>
<body>
<div class="app">
<div id="s-auth" class="scr active">
<div class="box">
<h1>Crypt<span>X</span></h1>
<p class="sub">منصة التراسل المشفر والخصوصية المطلقة</p>
<input type="text" id="rName" placeholder="الاسم الظاهر (مثال: سعد ماهر)">
<input type="text" id="rUser" placeholder="اسم المستخدم بالإنجليزية (مثال: saad99)">
<input type="password" id="rPass" placeholder="كلمة مرور الحساب (6 أحرف+)">
<button type="button" class="btn b1" id="btnStart">دخول / إنشاء حساب فوري 🚀</button>
<div id="fb" class="msg"></div>
</div>
</div>

<div id="s-home" class="scr">
<div class="hdr"><b style="font-size:20px">Crypt<span style="color:#38bdf8">X</span></b><span id="myTag" style="color:#38bdf8;font-size:13px">@user</span></div>
<div id="t-chat" style="display:flex;flex-direction:column;flex:1">
<div style="display:flex;gap:6px"><input id="sInput" placeholder="ابحث باسم مستخدم صديقك..."><button type="button" class="btn b1" style="width:auto;margin:0;padding:0 18px" id="btnSearch">بحث</button></div>
<div id="sRes"></div>
<div id="roomBox" style="display:none;flex-direction:column;flex:1">
<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><b id="peerTitle" style="color:#38bdf8"></b><button type="button" class="btn b2" style="width:auto;padding:6px 12px;margin:0" id="btnClose">إغلاق</button></div>
<input type="password" id="roomKey" placeholder="🔑 الرمز السري المشترك بينكما...">
<div id="stream" class="chat"></div>
<textarea id="draft" rows="2" placeholder="اكتب رسالتك المشفرة..."></textarea>
<button type="button" class="btn b1" id="btnSend">إرسال مشفر 🔒</button>
</div>
</div>
<div id="t-tool" style="display:none;flex-direction:column">
<textarea id="tIn" rows="3" placeholder="النص أو الرموز المشفرة..."></textarea>
<input type="password" id="tKey" placeholder="كلمة السر...">
<div style="display:flex;gap:8px"><button type="button" class="btn b1" id="btnEnc">تشفير 🔒</button><button type="button" class="btn b2" id="btnDec">فك التشفير 🔓</button></div>
<textarea id="tOut" rows="3" readonly placeholder="النتيجة ستظهر هنا..."></textarea>
</div>
<div class="nav">
<button type="button" class="btn b2" id="nav1">💬 المحادثات</button>
<button type="button" class="btn b2" id="nav2">🔐 التشفير</button>
<button type="button" class="btn b3" style="width:auto;padding:0 16px" id="btnOut">خروج</button>
</div>
</div>
</div>

<script>
const DB="https://googleapis.com";
let prof=JSON.parse(localStorage.getItem("cx_prof")||"null"),peer=null,tmr=null;
const note=t=>{const e=document.getElementById("fb");e.style.display="block";e.innerText=t};

function openHome(){
document.getElementById("s-auth").classList.remove("active");
document.getElementById("s-home").classList.add("active");
document.getElementById("myTag").innerText="@"+prof.user;
}
if(prof)openHome();

document.getElementById("btnStart").onclick=async()=>{
const name=document.getElementById("rName").value.trim();
const user=document.getElementById("rUser").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
const pass=document.getElementById("rPass").value;
if(user.length<3||pass.length<4){note("⚠️ أدخل اسم مستخدم إنجليزي (3 أحرف+) وكلمة مرور (4 أحرف+)");return}
note("⏳ جاري الاتصال بالخادم...");
try{
const r=await fetch(`${DB}/accounts/${user}`);
if(r.ok){
const d=await r.json();
if(d.fields.pass.stringValue!==pass){note("❌ اسم المستخدم محجوز أو كلمة المرور غير صحيحة!");return}
prof={name:d.fields.name.stringValue,user};
}else{
if(!name){note("⚠️ هذا حساب جديد! اكتب اسمك الظاهر في الخانة الأولى.");return}
const save=await fetch(`${DB}/accounts?documentId=${user}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{name:{stringValue:name},user:{stringValue:user},pass:{stringValue:pass}}})});
if(!save.ok){note("❌ تعذر الحفظ، تأكد من تفعيل وضع الاختبار في Firestore.");return}
prof={name,user};
}
localStorage.setItem("cx_prof",JSON.stringify(prof));
openHome();
}catch(e){note("❌ خطأ شبكة: "+e.message)}
};

document.getElementById("nav1").onclick=()=>{document.getElementById("t-chat").style.display="flex";document.getElementById("t-tool").style.display="none"};
document.getElementById("nav2").onclick=()=>{document.getElementById("t-chat").style.display="none";document.getElementById("t-tool").style.display="flex"};
document.getElementById("btnOut").onclick=()=>{localStorage.clear();location.reload()};

document.getElementById("btnSearch").onclick=async()=>{
const u=document.getElementById("sInput").value.trim().toLowerCase().replace("@",""),out=document.getElementById("sRes");
if(!u||u===prof.user)return;
out.innerHTML="<div class='msg' style='display:block'>⏳ جاري البحث...</div>";
const r=await fetch(`${DB}/accounts/${u}`);
if(!r.ok){out.innerHTML="<div class='msg' style='display:block;color:#f43f5e'>❌ لم يتم العثور على المستخدم</div>";return}
const d=await r.json();
peer={user:u,name:d.fields.name.stringValue};
out.innerHTML="";
document.getElementById("roomBox").style.display="flex";
document.getElementById("peerTitle").innerText=`${peer.name} (@${peer.user})`;
loadMsgs();if(tmr)clearInterval(tmr);tmr=setInterval(loadMsgs,3000);
};

document.getElementById("btnClose").onclick=()=>{clearInterval(tmr);document.getElementById("roomBox").style.display="none"};

async function enc(t,p){
const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
const c=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(t)));
const b=new Uint8Array(28+c.length);b.set(s);b.set(iv,16);b.set(c,28);
return btoa(String.fromCharCode(...b));
}
async function dec(b64,p){
const b=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b.slice(0,16),iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(16,28)},k,b.slice(28)));
}

document.getElementById("btnSend").onclick=async()=>{
const t=document.getElementById("draft").value.trim(),k=document.getElementById("roomKey").value;
if(!t||!k){alert("اكتب الرسالة والرمز السري!");return}
const rid=[prof.user,peer.user].sort().join("_"),c=await enc(t,k);
document.getElementById("draft").value="";
await fetch(`${DB}/chats/${rid}/messages`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{s:{stringValue:prof.user},c:{stringValue:c},ts:{integerValue:String(Date.now())}}})});
loadMsgs();
};

async function loadMsgs(){
if(!peer)return;
const rid=[prof.user,peer.user].sort().join("_"),st=document.getElementById("stream");
const r=await fetch(`${DB}/chats/${rid}/messages?pageSize=50`);
if(!r.ok)return;
const d=await r.json();if(!d.documents){st.innerHTML="";return}
const docs=d.documents.sort((a,b)=>Number(a.fields.ts.integerValue)-Number(b.fields.ts.integerValue));
st.innerHTML="";
docs.forEach(m=>{
const sender=m.fields.s.stringValue,cipher=m.fields.c.stringValue;
const div=document.createElement("div");div.className="bbl"+(sender===prof.user?" me":"");
div.innerHTML=`<div style="font-size:10px;color:#94a3b8">@${sender}</div><div>${cipher}</div>`;
const btn=document.createElement("button");btn.innerText="فك التشفير 🔓";
btn.style.cssText="margin-top:6px;padding:4px 10px;border-radius:6px;border:1px solid #38bdf8;background:#050811;color:#38bdf8;font-size:11px";
btn.onclick=async()=>{
const k=document.getElementById("roomKey").value;if(!k){alert("أدخل الرمز السري أولاً!");return}
try{btn.previousElementSibling.innerText=await dec(cipher,k);btn.remove()}catch{alert("❌ الرمز السري خطأ!")}
};
div.appendChild(btn);st.appendChild(div);
});
}

document.getElementById("btnEnc").onclick=async()=>{
