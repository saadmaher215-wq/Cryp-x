<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CryptX</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}
body{background:#050811;color:#f8fafc;display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:480px;padding:24px 18px;display:flex;flex-direction:column}
.scr{display:none;flex-direction:column;flex:1}.scr.active{display:flex}
.box{margin:auto 0;text-align:center}
h1{font-size:38px;font-weight:900;margin-bottom:6px}h1 span{color:#38bdf8}
p.sub{color:#94a3b8;font-size:13px;margin-bottom:24px}
input,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:15px;margin-bottom:10px;outline:none}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;margin-top:6px}
.b1{background:#38bdf8;color:#050811}.b2{background:#1e293b;color:#fff}.b3{background:#f43f5e;color:#fff}
.msg{margin-top:12px;padding:10px;border-radius:10px;font-size:13px;background:#1e293b;color:#38bdf8;display:none}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid #1e293b;margin-bottom:14px}
.chat{background:#02040a;border:1px solid #1e293b;border-radius:12px;padding:12px;height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin:8px 0}
.bbl{background:#1e293b;padding:10px;border-radius:12px;font-size:13px;word-break:break-all;align-self:flex-start;max-width:85%}
.bbl.me{background:#0c4a6e;align-self:flex-end}
.nav{display:flex;gap:6px;margin-top:auto;padding-top:12px}
</style>
</head>
<body>
<div class="app">
<div id="s-auth" class="scr active">
<div class="box">
<h1>Crypt<span>X</span></h1>
<p class="sub">منصة التراسل المشفر والخصوصية المطلقة</p>
<input type="email" id="em" placeholder="البريد الإلكتروني (Gmail)">
<input type="password" id="pw" placeholder="كلمة المرور">
<button class="btn b1" onclick="loginEmail()">دخول / إنشاء حساب 🚀</button>
<button class="btn b2" onclick="loginGuest()">دخول فوري وسريع كضيف 🕵️‍♂️</button>
<div id="fb1" class="msg"></div>
</div>
</div>

<div id="s-reg" class="scr">
<div class="box">
<h2 style="margin-bottom:16px">اختر هويتك الرقمية</h2>
<input type="text" id="rName" placeholder="الاسم الظاهر (مثال: سعد)">
<input type="text" id="rUser" placeholder="اسم المستخدم بالإنجليزية (مثال: saad99)">
<button class="btn b1" onclick="saveProfile()">حفظ والدخول ✅</button>
<div id="fb2" class="msg"></div>
</div>
</div>

<div id="s-home" class="scr">
<div class="hdr"><b style="font-size:20px">Crypt<span style="color:#38bdf8">X</span></b><span id="myTag" style="color:#38bdf8;font-size:13px">@user</span></div>
<div id="t-chat" style="display:flex;flex-direction:column;flex:1">
<div style="display:flex;gap:6px"><input id="sInput" placeholder="ابحث باسم مستخدم صديقك..."><button class="btn b1" style="width:auto;margin:0;padding:0 18px" onclick="findPeer()">بحث</button></div>
<div id="sRes"></div>
<div id="roomBox" style="display:none;flex-direction:column;flex:1">
<div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><b id="peerTitle" style="color:#38bdf8"></b><button class="btn b2" style="width:auto;padding:6px 12px;margin:0" onclick="closeRoom()">إغلاق</button></div>
<input type="password" id="roomKey" placeholder="🔑 الرمز السري المشترك بينكما...">
<div id="stream" class="chat"></div>
<textarea id="draft" rows="2" placeholder="اكتب رسالتك المشفرة..."></textarea>
<button class="btn b1" onclick="sendMsg()">إرسال مشفر 🔒</button>
</div>
</div>
<div id="t-tool" style="display:none;flex-direction:column">
<textarea id="tIn" rows="3" placeholder="النص أو الرموز المشفرة..."></textarea>
<input type="password" id="tKey" placeholder="كلمة السر...">
<div style="display:flex;gap:8px"><button class="btn b1" onclick="runTool(1)">تشفير 🔒</button><button class="btn b2" onclick="runTool(0)">فك التشفير 🔓</button></div>
<textarea id="tOut" rows="3" readonly placeholder="النتيجة ستظهر هنا..."></textarea>
</div>
<div class="nav">
<button class="btn b2" onclick="tab(1)">💬 المحادثات</button>
<button class="btn b2" onclick="tab(2)">🔐 التشفير</button>
<button class="btn b3" style="width:auto;padding:0 16px" onclick="logout()">خروج</button>
</div>
</div>
</div>

<script>
const K=["AIzaSyC92gWqRzk9QT","uUDliNCPtw6kveLJWUMvU"].join(""),P="cryptx-app";
const DB=`https://googleapis.com{P}/databases/(default)/documents`;
const AU=`https://googleapis.com{K}`;
const AI=`https://googleapis.com{K}`;
let ses=JSON.parse(localStorage.getItem("cx_s")||"null"),prof=JSON.parse(localStorage.getItem("cx_p")||"null"),peer=null,tmr=null;
const show=id=>{document.querySelectorAll(".scr").forEach(e=>e.classList.remove("active"));document.getElementById(id).classList.add("active")};
const note=(id,t)=>{const e=document.getElementById(id);e.style.display="block";e.innerText=t};

if(ses&&prof)openHome();else if(ses)show("s-reg");

async function loginGuest(){
note("fb1","⏳ جاري الدخول كضيف...");
try{
const r=await fetch(AU,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({returnSecureToken:true})});
const d=await r.json();
if(d.error){note("fb1","❌ "+d.error.message);return}
ses={uid:d.localId};localStorage.setItem("cx_s",JSON.stringify(ses));show("s-reg");
}catch(e){note("fb1","❌ خطأ اتصال: "+e.message)}
}

async function loginEmail(){
const email=document.getElementById("em").value.trim(),password=document.getElementById("pw").value;
if(!email||password.length<6){note("fb1","⚠️ أدخل بريد وكلمة مرور (6 أحرف+)");return}
note("fb1","⏳ جاري التحقق...");
try{
let r=await fetch(AI,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password,returnSecureToken:true})});
let d=await r.json();
if(d.error&&d.error.message.includes("EMAIL_NOT_FOUND")){
r=await fetch(AU,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,password,returnSecureToken:true})});
d=await r.json();
}
if(d.error){note("fb1","❌ "+d.error.message);return}
ses={uid:d.localId};localStorage.setItem("cx_s",JSON.stringify(ses));
const pr=await fetch(`${DB}/users/${ses.uid}`);
if(pr.ok){const doc=await pr.json();prof={uid:ses.uid,name:doc.fields.name.stringValue,user:doc.fields.user.stringValue};localStorage.setItem("cx_p",JSON.stringify(prof));openHome()}
else show("s-reg");
}catch(e){note("fb1","❌ خطأ: "+e.message)}
}

async function saveProfile(){
const name=document.getElementById("rName").value.trim(),user=document.getElementById("rUser").value.trim().toLowerCase().replace(/[^a-z0-9_]/g,"");
if(!name||user.length<3){note("fb2","⚠️ أدخل الاسم واسم مستخدم إنجليزي (3 أحرف+)");return}
note("fb2","⏳ جاري الحفظ...");
const chk=await fetch(`${DB}/usernames/${user}`);
if(chk.ok){note("fb2","❌ اسم المستخدم محجوز! اختر غيره.");return}
await fetch(`${DB}/usernames?documentId=${user}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{uid:{stringValue:ses.uid}}})});
await fetch(`${DB}/users?documentId=${ses.uid}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:{name:{stringValue:name},user:{stringValue:user}}})});
prof={uid:ses.uid,name,user};localStorage.setItem("cx_p",JSON.stringify(prof));openHome();
}

function openHome(){document.getElementById("myTag").innerText="@"+prof.user;show("s-home")}
function tab(n){document.getElementById("t-chat").style.display=n===1?"flex":"none";document.getElementById("t-tool").style.display=n===2?"flex":"none"}
function logout(){localStorage.clear();location.reload()}

async function findPeer(){
const u=document.getElementById("sInput").value.trim().toLowerCase().replace("@",""),out=document.getElementById("sRes");
if(!u||u===prof.user)return;out.innerHTML="<div class='msg' style='display:block'>⏳ جاري البحث...</div>";
const r=await fetch(`${DB}/usernames/${u}`);
if(!r.ok){out.innerHTML="<div class='msg' style='display:block;color:#f43f5e'>❌ غير موجود</div>";return}
const uid=(await r.json()).fields.uid.stringValue,pr=await(await fetch(`${DB}/users/${uid}`)).json();
peer={uid,user:pr.fields.user.stringValue,name:pr.fields.name.stringValue};
out.innerHTML="";document.getElementById("roomBox").style.display="flex";document.getElementById("peerTitle").innerText=`${peer.name} (@${peer.user})`;
loadMsgs();if(tmr)clearInterval(tmr);tmr=setInterval(loadMsgs,3000);
}
function closeRoom(){clearInterval(tmr);document.getElementById("roomBox").style.display="none"}

async function enc(t,p){
const s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:s,iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt"]);
const c=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},k,new TextEncoder().encode(t)));
const b=new Uint8Array(28+c.length);b.set(s);b.set(iv,16);b.set(c,28);
return btoa(String.fromCharCode(...b));
}
async function dec(b64,p){
const b=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b.slice(0,16),iterations:100000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b.slice(16,28)},k,b.slice(28)));
}

async function sendMsg(){
const t=document.getElementById("draft").value.trim(),k=document.getElementById("roomKey").value;
if(!t||!k){alert("اكتب الرسالة والرمز السري!");return}
