<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#090d16">
    <title>CryptX - شبكة التواصل المشفر</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: #111827;
            --bg-input: #1e293b;
            --primary: #38bdf8;
            --primary-dark: #0284c7;
            --accent: #f43f5e;
            --success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 0; }
        body { background: #000000; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        
        .app-shell {
            width: 100%;
            max-width: 480px;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        /* شاشات المصادقة والإعداد */
        .screen { display: none; flex-direction: column; flex: 1; padding: 30px 24px; }
        .screen.active { display: flex; }
        .auth-center { margin: auto 0; text-align: center; }

        .brand-logo { font-size: 48px; font-weight: 900; color: var(--primary); letter-spacing: 2px; margin-bottom: 6px; }
        .brand-logo span { color: var(--accent); }
        .brand-sub { color: var(--text-muted); font-size: 14px; margin-bottom: 35px; }

        input, textarea {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-main);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: var(--primary); }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s, opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.97); }
        .btn-primary { background: var(--primary); color: #090d16; }
        .btn-secondary { background: var(--bg-input); color: var(--text-main); border: 1px solid #334155; }
        .btn-danger { background: rgba(244, 63, 94, 0.12); color: var(--accent); border: 1px solid rgba(244, 63, 94, 0.3); }

        .status-banner {
            margin-top: 14px;
            font-size: 13px;
            min-height: 22px;
            color: #fbbf24;
            line-height: 1.5;
        }

        /* الشريط العلوي */
        .top-header {
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(10px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 40;
        }
        .header-title { font-size: 22px; font-weight: 900; color: var(--primary); }
        .header-title span { color: var(--accent); }
        .header-badge { background: var(--bg-input); padding: 5px 12px; border-radius: 20px; font-size: 12px; color: var(--primary); font-weight: bold; }

        /* محتوى التبويبات */
        .tab-container { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 85px; }
        .tab-view { display: none; flex-direction: column; }
        .tab-view.active { display: flex; }

        /* البحث وقائمة الأصدقاء */
        .search-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .search-row input { margin: 0; }
        .search-row button { width: auto; margin: 0; padding: 0 18px; }

        .card-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 14px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .user-info-row { display: flex; align-items: center; gap: 12px; }
        .mini-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 18px; color: white;
        }

        /* غرفة المحادثة */
        .chat-header-bar {
            background: var(--bg-card);
            padding: 10px 14px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        .back-btn { background: var(--bg-input); color: var(--text-main); width: auto; margin: 0; padding: 6px 12px; font-size: 12px; border-radius: 8px; }
        
        .messages-feed {
            background: #060910;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px;
            height: 270px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 8px 0;
        }
        .bubble {
            background: var(--bg-input);
            padding: 10px 14px;
            border-radius: 16px;
            max-width: 85%;
            align-self: flex-start;
            word-break: break-all;
            font-size: 13px;
            border-bottom-right-radius: 4px;
        }
        .bubble.mine {
            background: var(--primary-dark);
            align-self: flex-end;
            border-bottom-right-radius: 16px;
            border-bottom-left-radius: 4px;
        }
        .bubble-top { display: flex; justify-content: space-between; font-size: 10px; opacity: 0.75; margin-bottom: 4px; gap: 12px; }
        .decrypt-tag {
            background: rgba(9, 13, 22, 0.7);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            margin-top: 6px;
            width: auto;
            display: inline-block;
        }

        /* شاشة الملف الشخصي (ستايل تيك توك) */
        .tiktok-profile { display: flex; flex-direction: column; align-items: center; padding: 15px 0 20px; border-bottom: 1px solid var(--border); }
        .big-avatar {
            width: 92px; height: 92px; border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; justify-content: center; align-items: center;
            font-size: 38px; font-weight: 900; color: white;
            margin-bottom: 12px;
            box-shadow: 0 0 0 3px var(--bg-dark), 0 0 0 5px var(--primary);
        }
        .profile-name { font-size: 20px; font-weight: 800; }
        .profile-handle {
            background: var(--bg-input); color: var(--text-muted);
            padding: 5px 14px; border-radius: 20px; font-size: 13px;
            margin-top: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
        }
        .profile-bio { color: var(--text-muted); font-size: 13px; margin-top: 10px; text-align: center; max-width: 85%; }

        .tiktok-stats { display: flex; justify-content: space-around; width: 100%; margin-top: 20px; }
        .stat-col { text-align: center; flex: 1; }
        .stat-col:not(:last-child) { border-left: 1px solid var(--border); }
        .stat-val { font-size: 17px; font-weight: 800; color: var(--text-main); }
        .stat-lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .settings-group { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
        .setting-row {
            background: var(--bg-card); border: 1px solid var(--border);
            padding: 14px 16px; border-radius: 14px;
            display: flex; justify-content: space-between; align-items: center; font-size: 14px;
        }
        .small-action { width: auto; margin: 0; padding: 6px 12px; font-size: 12px; border-radius: 8px; }

        /* شريط التنقل السفلي */
        .bottom-bar {
            position: fixed; bottom: 0; width: 100%; max-width: 480px;
            background: rgba(9, 13, 22, 0.98);
            border-top: 1px solid var(--border);
            display: flex; padding: 8px 0; z-index: 50;
        }
        .nav-btn {
            flex: 1; text-align: center; color: var(--text-muted);
            font-size: 11px; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
        }
        .nav-btn.active { color: var(--primary); font-weight: bold; }
        .nav-btn .ico { font-size: 20px; }
    </style>
</head>
<body>

<div class="app-shell">

    <div id="screen-login" class="screen active">
        <div class="auth-center">
            <div class="brand-logo">Crypt<span>X</span></div>
            <p class="brand-sub">تطبيق المراسلة المشفر والخصوصية المطلقة</p>
            <button type="button" class="btn-primary" onclick="loginGoogle()">المتابعة باستخدام Google 🚀</button>
            <button type="button" class="btn-secondary" onclick="loginGuest()">دخول سريع كضيف 🕵️‍♂️</button>
            <div id="loginStatus" class="status-banner"></div>
        </div>
    </div>

    <div id="screen-setup" class="screen">
        <div class="auth-center">
